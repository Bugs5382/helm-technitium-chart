name: Lint_and_Test
# Helm lint, the helm-unittest suites, a dry run, and a real install on a kind
# cluster.
#
# Pull requests only, and not while the PR is a draft: the PR run covers what
# merges, so nothing reruns on push to main. The job still runs for
# workflow_dispatch and when the Release Manager calls it before a publish.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # helm-unittest's plugin.yaml uses the `platformHooks` schema, which Helm
  # only understands from v3.18 on.
  HELM_VERSION: v3.21.3
  HELM_UNITTEST_VERSION: 1.2.1
  HELM_UNITTEST_SHA256: 48e86ecc1467b009630e5954375e5d8494139f73b466df5fe8c04fa45b634939

jobs:
  Lint_and_Test:
    name: 🧪 Lint & Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint Charts
        run: helm lint technitium

      - name: Install the helm-unittest plugin
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/helm-plugins/helm-unittest"
          mkdir -p "$dir"
          curl -fsSLo "$RUNNER_TEMP/unittest.tgz" "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION}.tgz"
          echo "${HELM_UNITTEST_SHA256}  $RUNNER_TEMP/unittest.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/unittest.tgz" -C "$dir"
          echo "HELM_PLUGINS=$RUNNER_TEMP/helm-plugins" >> "$GITHUB_ENV"

      - name: Chart unit tests
        run: helm unittest technitium

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Dry Run Install
        run: helm install technitium-test-release technitium/ --dry-run --debug

      - name: Install Chart
        run: |
          helm install technitium-test-release technitium/ --set config.dnsDomain="dns-server"
          # Wait up to 3 minutes for the deployment to be successful
          kubectl wait --for=condition=available --timeout=180s deployment/technitium-test-release
