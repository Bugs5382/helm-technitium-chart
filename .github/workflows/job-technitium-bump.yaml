name: Technitium Version Tracker
# Opens an issue and a bump PR when a newer stable Technitium DNS Server image
# is on Docker Hub than the chart appVersion (issue #37). The owner still
# reviews, merges and releases. The logic lives in
# .github/scripts/technitium-version.sh so it can be unit-tested.
#
# The PR is opened with the release GitHub App token, not GITHUB_TOKEN, because
# a PR opened with GITHUB_TOKEN does not trigger the repo's CI.

on:
  schedule:
    - cron: "17 6 * * *"  # Daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be done"
        type: boolean
        default: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/scripts/technitium-version*.sh'
      - '.github/workflows/job-technitium-bump.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'tracker' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test Version Script
    # Draft PRs are skipped; the schedule and manual runs always test first.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run unit tests
        run: bash .github/scripts/technitium-version_test.sh

  bump:
    name: 🔄 Check Technitium Release
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check for a new release and open the bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: bash .github/scripts/technitium-version.sh run
