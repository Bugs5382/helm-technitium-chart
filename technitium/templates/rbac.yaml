{{/*
  Cluster mode needs the post-install join Job to look up the *real pod IP*
  behind each release's web Service. The pod IP is the source IP of outbound
  traffic from the pod (Kubernetes does not SNAT pod traffic to the Service
  ClusterIP), so it has to be the IP we register with Technitium; otherwise
  catalog-zone AXFR is refused because the allow-list contains a ClusterIP
  that the wire never sees.

  We do that lookup via the EndpointSlice API (discovery.k8s.io/v1), since
  v1 Endpoints is deprecated from Kubernetes 1.33 (issue #33). EndpointSlice
  names are generated and the Job finds them with a
  `kubernetes.io/service-name` label selector, so the Role needs `list` and
  cannot be narrowed with resourceNames. It stays read-only and scoped to
  this namespace. The ServiceAccount is the one the chart already creates.
*/}}
{{- if and .Values.cluster.enabled .Values.cluster.autoJoin -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "technitium.fullname" . }}-cluster
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-rbac
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "technitium.fullname" . }}-cluster
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "technitium.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "technitium.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
