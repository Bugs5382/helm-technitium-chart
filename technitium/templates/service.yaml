---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "technitium.fullname" . }}-web
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
    {{- with include "technitium.serviceExtraLabels" (dict "root" . "labels" .Values.service.web.labels) | trim }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.web.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.web.type | default "ClusterIP" }}
  selector:
    {{- include "technitium.selectorLabels" . | nindent 4 }}
  ports:
    - name: web-ui-http
      port: {{ .Values.ports.webHttp | default 5380 }}
      targetPort: web-ui-http
      protocol: TCP
    {{- if eq (include "technitium.httpsEnabled" .) "true" }}
    - name: web-ui-https
      port: {{ .Values.ports.webHttps | default 53443 }}
      targetPort: web-ui-https
      protocol: TCP
    {{- end }}
    {{- if .Values.ports.dohHttpProxy.enabled }}
    - name: doh-proxy-http
      port: 80
      targetPort: doh-proxy-http
      protocol: TCP
    {{- end }}
    {{- if .Values.ports.dohProxy.enabled }}
    - name: doh-proxy
      port: 8053
      targetPort: doh-proxy
      protocol: TCP
    {{- end }}
    {{- if .Values.cluster.enabled }}
    # Cluster mode (issue #3): this Service's ClusterIP is the node address
    # registered with Technitium, so peers send the HTTPS API, NOTIFY and
    # AXFR/IXFR here. Replies to peers leave from the pod IP, which the
    # cluster.podNetworks settings allow.
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "technitium.fullname" . }}-dns
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
    app.kubernetes.io/component: dns
    {{- with include "technitium.serviceExtraLabels" (dict "root" . "labels" .Values.service.dns.labels) | trim }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.dns.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.dns.type | default "LoadBalancer" }}
  {{- if .Values.service.dns.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.dns.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "technitium.selectorLabels" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    {{- if .Values.ports.doq.enabled }}
    - name: doq-udp
      port: 853
      targetPort: doq-udp
      protocol: UDP
    {{- end }}
    {{- if .Values.ports.dot.enabled }}
    - name: dot-tcp
      port: 853
      targetPort: dot-tcp
      protocol: TCP
    {{- end }}
    {{- if .Values.ports.doh3.enabled }}
    - name: doh3-udp
      port: 443
      targetPort: doh3-udp
      protocol: UDP
    {{- end }}
    {{- if .Values.ports.doh.enabled }}
    - name: doh-tcp
      port: 443
      targetPort: doh-tcp
      protocol: TCP
    {{- end }}
    {{- if .Values.ports.dhcp.enabled }}
    - name: dhcp
      port: 67
      targetPort: dhcp
      protocol: UDP
    {{- end }}
{{- /*
  Shared DNS front for a Technitium cluster (issue #3), rendered by the
  primary release only. It selects the pods of every release in this
  namespace with the same cluster.domain, so clients keep one address when a
  node is down; the cluster keeps the nodes' data in sync.
*/}}
{{- $front := .Values.cluster.frontService | default dict }}
{{- if and .Values.cluster.enabled $front.enabled (eq (.Values.cluster.primaryReleaseName | toString) "") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "technitium.fullname" . }}-cluster-dns
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-dns
    {{- with include "technitium.serviceExtraLabels" (dict "root" . "labels" $front.labels) | trim }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- with $front.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $front.type | default "LoadBalancer" }}
  {{- if $front.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $front.externalTrafficPolicy }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "technitium.name" . }}
    technitium.io/cluster-domain: {{ .Values.cluster.domain | replace "." "-" | trunc 63 | trimSuffix "-" | quote }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
{{- end }}
