suite: deployment references to the administrator Secret, issue 57
templates:
  - deployment.yaml
  - configmap-bootstrap.yaml
tests:
  - it: reads the default Secret and key by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: DNS_SERVER_ADMIN_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-technitium-admin
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: password

  - it: reads the external Secret name when one is set
    documentSelector: {path: kind, value: Deployment}
    set:
      config.existingSecret: my-external-admin-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: my-external-admin-secret
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: password

  - it: reads a custom key name out of the external Secret
    documentSelector: {path: kind, value: Deployment}
    set:
      config.existingSecret: my-external-admin-secret
      config.passwordKey: admin-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: admin-pass

  - it: the bootstrap sidecar also reads the external Secret and key
    documentSelector: {path: kind, value: Deployment}
    set:
      config.existingSecret: my-external-admin-secret
      config.passwordKey: admin-pass
      bootstrap.enabled: true
      bootstrap.zones: ["example.com"]
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: bootstrap
      - equal:
          path: spec.template.spec.containers[1].env[2].name
          value: ADMIN_PASSWORD
      - equal:
          path: spec.template.spec.containers[1].env[2].valueFrom.secretKeyRef.name
          value: my-external-admin-secret
      - equal:
          path: spec.template.spec.containers[1].env[2].valueFrom.secretKeyRef.key
          value: admin-pass

  - it: fails when the external Secret name is not a valid Kubernetes name
    template: deployment.yaml
    set:
      config.existingSecret: "Not_Valid!"
    asserts:
      - failedTemplate:
          errorPattern: "config.existingSecret must be a valid Kubernetes Secret name"

  - it: fails when an external Secret is set with an empty password key
    template: deployment.yaml
    set:
      config.existingSecret: my-external-admin-secret
      config.passwordKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "config.passwordKey must not be empty when config.existingSecret is set"

  - it: fails when the password key contains characters a Secret key cannot have
    template: deployment.yaml
    set:
      config.existingSecret: my-external-admin-secret
      config.passwordKey: "bad key!"
    asserts:
      - failedTemplate:
          errorPattern: "config.passwordKey must contain only letters, numbers, dots, underscores, and hyphens"
