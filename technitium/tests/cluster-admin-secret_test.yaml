suite: cluster-join Job administrator secrets, issue 57
templates:
  - job-cluster.yaml
tests:
  - it: the primary node reads its own default admin Secret
    set:
      cluster.enabled: true
      cluster.domain: ns.example.local
      cluster.podNetworks: ["10.244.0.0/16"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[7].name
          value: MY_ADMIN_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-technitium-admin
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.key
          value: password

  - it: a secondary node reads its own default Secret and the primary's external Secret/key
    set:
      cluster.enabled: true
      cluster.domain: ns.example.local
      cluster.primaryReleaseName: primary-release
      cluster.primaryAdminSecretName: primary-external-admin-secret
      cluster.primaryAdminPasswordKey: primary-admin-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-technitium-admin
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.key
          value: password
      - equal:
          path: spec.template.spec.containers[0].env[10].name
          value: PRIMARY_ADMIN_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].env[10].valueFrom.secretKeyRef.name
          value: primary-external-admin-secret
      - equal:
          path: spec.template.spec.containers[0].env[10].valueFrom.secretKeyRef.key
          value: primary-admin-pass

  - it: a secondary node with its own external Secret reads that instead of the default
    set:
      cluster.enabled: true
      cluster.domain: ns.example.local
      cluster.primaryReleaseName: primary-release
      config.existingSecret: my-own-external-secret
      config.passwordKey: my-own-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.name
          value: my-own-external-secret
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.key
          value: my-own-key

  - it: fails when the primary's external Secret name is not a valid Kubernetes name
    set:
      cluster.enabled: true
      cluster.domain: ns.example.local
      cluster.primaryReleaseName: primary-release
      cluster.primaryAdminSecretName: "Not_Valid!"
    asserts:
      - failedTemplate:
          errorMessage: "cluster.primaryAdminSecretName must be a valid Kubernetes Secret name"

  - it: fails when a secondary's primary password key is emptied out
    set:
      cluster.enabled: true
      cluster.domain: ns.example.local
      cluster.primaryReleaseName: primary-release
      cluster.primaryAdminPasswordKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "cluster.primaryAdminPasswordKey must not be empty"
