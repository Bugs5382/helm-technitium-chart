suite: cluster-join Job primary service discovery, issue 61
templates:
- job-cluster.yaml
release:
  name: secondary
  namespace: dns
tests:
- it: does not repeat the chart name when it is the primary release name
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: technitium
    config.existingSecret: secondary-admin
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: technitium-web
- it: does not repeat the chart name contained in a primary release name
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: technitium-primary
    config.existingSecret: secondary-admin
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: technitium-primary-web
- it: recognizes the chart name inside the primary release name
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: my-technitium-primary
    config.existingSecret: secondary-admin
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: my-technitium-primary-web
- it: appends the chart name for an unrelated primary release name
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: tech-a
    config.existingSecret: secondary-admin
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: tech-a-technitium-web
- it: uses a primary release matching the name override without duplication
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: dns
    config.existingSecret: secondary-admin
    nameOverride: dns
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: dns-web
- it: uses a primary release containing the name override without duplication
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: dns-primary
    config.existingSecret: secondary-admin
    nameOverride: dns
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: dns-primary-web
- it: appends the name override for an unrelated primary release name
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: tech-a
    config.existingSecret: secondary-admin
    nameOverride: dns
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: tech-a-dns-web
- it: does not apply the secondary fullname override to the primary service
  set:
    cluster.enabled: true
    cluster.autoJoin: true
    cluster.domain: ns.example.local
    cluster.primaryReleaseName: technitium
    config.existingSecret: secondary-admin
    fullnameOverride: custom-secondary
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: PRIMARY_SVC_NAME
        value: technitium-web
